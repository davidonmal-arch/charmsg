<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>CharMsg — анонимный мессенджер</title>
  <meta name="description" content="CharMsg — полностью анонимный мессенджер с исчезающими чатами и биржей CharCoin. Без email и номера телефона." />
  <link rel="icon" type="image/jpeg" href="./assets/logo.jpg" />
  <link rel="apple-touch-icon" href="./assets/logo.jpg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid-overlay"></span>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#/chats" aria-label="CharMsg">
        <span class="brand-logo"><img src="./assets/logo.jpg" alt="CharMsg" /></span>
        <span class="brand-text">
          <span class="brand-name">CharMsg</span>
          <span class="brand-sub">anonymous</span>
        </span>
      </a>

      <nav class="nav" id="mainNav">
        <a href="#/chats" data-route="chats" class="nav-link">Чаты</a>
        <a href="#/games" data-route="games" class="nav-link">Игры</a>
        <a href="#/nfts" data-route="nfts" class="nav-link">NFT</a>
        <a href="#/profile" data-route="profile" class="nav-link">Профиль</a>
      </nav>

      <div class="topbar-right">
        <a class="balance-chip" href="#/market" id="balanceChip" title="Баланс CharCoin">
          <span class="balance-icon">◈</span>
          <span class="balance-value" id="balanceValue">100</span>
        </a>
        <button class="admin-entry" id="adminEntryBtn" type="button" title="Вход для администратора" aria-label="Вход для администратора">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
        <button class="me-btn" id="meBtn" type="button" aria-label="Мой профиль">
          <span class="avatar" id="meAvatar"></span>
          <span class="me-name" id="meName">Гость</span>
        </button>
      </div>
    </header>

    <div id="quotaNotice" role="status" hidden></div>
    <aside id="communityEvent" class="card row wrap" aria-live="polite" hidden></aside>
    <main id="view" class="view-root" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Навигация">
      <a href="#/chats" data-route="chats"><span class="tab-icon" aria-hidden="true">☰</span><span>Чаты</span></a>
      <a href="#/games" data-route="games"><span class="tab-icon" aria-hidden="true">◇</span><span>Игры</span></a>
      <a href="#/nfts" data-route="nfts"><span class="tab-icon" aria-hidden="true">◈</span><span>NFT</span></a>
      <a href="#/profile" data-route="profile"><span class="tab-icon" aria-hidden="true">○</span><span>Профиль</span></a>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <div class="boot" id="boot">
    <div class="boot-logo"><img src="./assets/logo.jpg" alt="" /></div>
    <div class="boot-name">CharMsg</div>
    <div class="boot-spinner"></div>
    <div class="boot-text">Подключаемся к CharMsg…</div>
  </div>

  <script type="module" src="./js/app.js?v=upgrade-fix-20261119"></script>
</body>
</html>
